[project]
name = "bitcoin-private-blockspace"
version = "0.1.0"
description = "How much Bitcoin block space was sold outside the public fee auction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-bigquery-storage>=2.25.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "db-dtypes>=1.2.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["bigquery/tests"]
